name: Local SAST Scan

on:
  workflow_dispatch:
    inputs:
      fail_on:
        description: Fail threshold for local rules
        required: false
        default: high
        type: choice
        options: [none, critical, high, medium, low]
      profile_path:
        description: Optional checked-out SAST CI config exported by the platform
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "apps/**"
      - "scripts/sast_ci.py"
      - ".github/workflows/sast-local.yml"
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local SAST runtime
        run: pip install -r apps/api/requirements.txt
      - name: Scan repository and create SARIF
        id: sast
        shell: bash
        env:
          SAST_PROFILE_PATH: ${{ inputs.profile_path || '' }}
        run: |
          set +e
          args=(--source . --offline --json sast-result.json --sarif sast-result.sarif --fail-on "${{ inputs.fail_on || 'high' }}")
          if [[ -n "$SAST_PROFILE_PATH" ]]; then
            args+=(--profile "$SAST_PROFILE_PATH")
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            args+=(--baseline "${{ github.event.pull_request.base.sha }}" --changed-files-only)
          fi
          python scripts/sast_ci.py "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: sast-evidence
          path: |
            sast-result.json
            sast-result.sarif
      - name: Upload SARIF to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sast-result.sarif
      - name: Summarize SAST result on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SAST_EXIT_CODE: ${{ steps.sast.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('sast-result.json', 'utf8'));
            const marker = '<!-- ai-security-sast-summary -->';
            const body = `${marker}\n## Local SAST quality gate\n\n- Findings: ${result.finding_count}\n- Threshold: ${{ inputs.fail_on || 'high' }}\n- Result: ${process.env.SAST_EXIT_CODE === '0' ? 'pass' : 'block'}\n- Evidence: workflow artifact \`sast-evidence\` and uploaded SARIF.\n\nThis is a deterministic static-analysis result; review context before remediation.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(comment => comment.body && comment.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Enforce SAST threshold
        if: steps.sast.outputs.exit_code != '0'
        run: exit ${{ steps.sast.outputs.exit_code }}
