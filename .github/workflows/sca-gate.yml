name: SCA Gate

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Project UUID registered in the AI security platform
        required: true
        type: string
      scan_task_id:
        description: Completed SCA scan UUID to gate
        required: true
        type: string

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check required endpoint configuration
        env:
          SCA_API_BASE: ${{ secrets.SCA_API_BASE }}
          SCA_CI_USERNAME: ${{ secrets.SCA_CI_USERNAME }}
          SCA_CI_PASSWORD: ${{ secrets.SCA_CI_PASSWORD }}
        run: |
          test -n "$SCA_API_BASE"
          test -n "$SCA_CI_USERNAME"
          test -n "$SCA_CI_PASSWORD"
      - name: Authenticate and evaluate SCA gate
        env:
          SCA_API_BASE: ${{ secrets.SCA_API_BASE }}
          SCA_CI_USERNAME: ${{ secrets.SCA_CI_USERNAME }}
          SCA_CI_PASSWORD: ${{ secrets.SCA_CI_PASSWORD }}
          PROJECT_ID: ${{ inputs.project_id }}
          SCAN_TASK_ID: ${{ inputs.scan_task_id }}
        run: python scripts/sca_api_gate.py
